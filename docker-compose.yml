services:
  mysql:
    image: mysql:8.4
    container_name: studyos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studyos
      MYSQL_USER: studyos
      MYSQL_PASSWORD: studyos
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - studyos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  studyos_mysql:
