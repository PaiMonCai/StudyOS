name: Bootstrap Playwright dependency

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'bootstrap playwright') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add Playwright test dependency and script
        run: |
          npm install --save-dev @playwright/test@latest --package-lock-only --ignore-scripts
          npm pkg set scripts.test:e2e="playwright test"

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes."
            exit 0
          fi
          git commit -m "chore: add Playwright browser test dependency"
          git push
