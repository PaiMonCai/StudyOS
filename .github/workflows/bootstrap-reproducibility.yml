name: Bootstrap reproducibility files

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'ci: bootstrap lockfile and initial migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Generate initial Prisma migration
        env:
          DATABASE_URL: mysql://studyos:studyos@127.0.0.1:3306/studyos
        run: |
          mkdir -p prisma/migrations/20260922_initial
          npx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/migrations/20260922_initial/migration.sql
          cat > prisma/migrations/migration_lock.toml <<'EOF'
          provider = "mysql"
          EOF

      - name: Commit generated reproducibility files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: commit lockfile and initial migration"
          git push
