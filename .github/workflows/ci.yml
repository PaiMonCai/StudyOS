name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: mysql://studyos:studyos@127.0.0.1:3306/studyos

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: mysql://studyos:studyos@127.0.0.1:3306/studyos

      - name: Unit tests
        run: npm test
