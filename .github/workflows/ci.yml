name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: studyos
          MYSQL_USER: studyos
          MYSQL_PASSWORD: studyos
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ustudyos -pstudyos"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://studyos:studyos@127.0.0.1:3306/studyos
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: studyos
      DATABASE_PASSWORD: studyos
      DATABASE_NAME: studyos
      DEFAULT_USER_EMAIL: ci@studyos.local
      DEFAULT_USER_NAME: StudyOS CI
      OPENAI_MODEL: gpt-5.6
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed development curriculum
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: MySQL integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Production server smoke test
        run: |
          npm run start > /tmp/studyos-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/studyos-health.json; then
              cat /tmp/studyos-health.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/studyos-server.log
          exit 1
